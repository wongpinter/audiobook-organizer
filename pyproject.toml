[project]
name = "audiobook-fetcher"
version = "0.1.0"
description = "FileBot-style metadata fetcher and renamer for audiobooks"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "mutagen>=1.47",
    "textual>=0.55",
]

[project.scripts]
audiobook-fetcher = "audiobook_fetcher.cli:main"

[project.optional-dependencies]
scraping = [
    "selectolax>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
